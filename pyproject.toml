[project]
name = "skin-beauty-cn"
version = "2.2.2"
description = "Dependency-free ComfyUI skin-tone correction nodes with bilingual UI and optional MediaPipe masks"
readme = "README_EN.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "chen zhang" }]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/chen-zhang-ai/ComfyUI-SkinBeauty-CN"
Documentation = "https://github.com/chen-zhang-ai/ComfyUI-SkinBeauty-CN#readme"
"Bug Tracker" = "https://github.com/chen-zhang-ai/ComfyUI-SkinBeauty-CN/issues"

[tool.comfy]
PublisherId = "chen-zhang-ai"
DisplayName = "Skin Beauty CN｜人物肤色美白"
