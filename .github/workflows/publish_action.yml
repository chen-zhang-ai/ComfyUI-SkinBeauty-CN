name: Publish to Comfy Registry

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-v2.2.1 after GitHub Release and CI are verified
        required: true

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish immutable Registry version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Registry preflight
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "publish-v2.2.1"
          grep -Eq '^name = "skin-beauty-cn"$' pyproject.toml
          grep -Eq '^version = "2.2.1"$' pyproject.toml
          grep -Eq '^PublisherId = "[^\"]+"$' pyproject.toml || {
            echo "A real immutable [tool.comfy] PublisherId is required; GitHub login is not a substitute." >&2
            exit 1
          }
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
