name: GitHub Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  release:
    needs: quality
    name: Publish immutable GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified tag commit, resolved 2026-08-15
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, verified tag commit, resolved 2026-08-15
        with:
          python-version: "3.12"
      - name: Validate annotated tag, version, and protected-main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$TAG")" = tag
          test "$(git rev-parse "$TAG^{}")" = "$(git rev-parse HEAD)"
          version=$(python -c "import re,pathlib; print(re.search(r'(?m)^version = \"([^\"]+)\"$', pathlib.Path('pyproject.toml').read_text()).group(1))")
          test "$TAG" = "v$version"
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
      - name: Build deterministic release assets from the tag commit
        run: |
          python tools/build_release.py
          cd dist && sha256sum --check SHA256SUMS.txt
      - name: Add the previously sanitized showcase video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.2.1 --pattern skinbeauty-video-comparison.mp4 --dir dist
          cd dist
          echo "2e830967a4ea99900478fb592e995862da297b3b0652b3da81d98097efe0ae28  skinbeauty-video-comparison.mp4" | sha256sum --check -
          sha256sum skinbeauty-video-comparison.mp4 > skinbeauty-video-comparison.mp4.sha256
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite immutable assets." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --verify-tag --target "$(git rev-parse HEAD)" --title "ComfyUI-SkinBeauty-CN $TAG" --notes-file RELEASE_NOTES_v2.2.2.md
