name: GitHub Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new v-prefixed release tag
        required: true
        default: v2.2.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve and validate tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; fi
          case "$tag" in v*) ;; *) echo "Tag must start with v" >&2; exit 1;; esac
          version=$(python -c "import re,pathlib; print(re.search(r'(?m)^version = \"([^\"]+)\"$', pathlib.Path('pyproject.toml').read_text()).group(1))")
          test "$tag" = "v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify and build deterministic assets
        run: |
          python -m compileall -q -f .
          node --check web/skin_beauty.js
          python tools/build_release.py
          cd dist && sha256sum --check SHA256SUMS.txt
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite immutable assets." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "ComfyUI-SkinBeauty-CN $TAG" --notes-file RELEASE_NOTES_v2.2.1.md
